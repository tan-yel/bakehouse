name: Deploy Bakehouse

on:
  push:
    branches: main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  BAKEHOUSE_STACK_NAME: ${{ secrets.BAKEHOUSE_STACK_NAME }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Environment Setup & Deployment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect environment
        id: detect-env
        run: |
          BRANCH_NAME="${{ github.ref }}"
          if [[ "${BRANCH_NAME}" == "refs/heads/main" ]]; then
              ENV="staging"
              ACCOUNT="YOUR_ACCOUNT_ID"
          else
              ENV="dev"
              ACCOUNT="YOUR_ACCOUNT_ID"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "account=${ACCOUNT}" >> $GITHUB_OUTPUT

      - name: Extract student information
        id: student-info
        run: |
          # github.actor contains the GitHub username of who triggered the workflow
          STUDENT_NAME="${{ github.actor }}"
          echo "name=${STUDENT_NAME}" >> $GITHUB_OUTPUT
          echo "Student: ${STUDENT_NAME}"

      - name: Generate enhanced session name
        id: session-naming
        run: |
          # Enhanced session naming with:
          # - Student identifier (github.actor)
          # - Unique run ID (github.run_id)
          # - Retry attempt (github.run_attempt)

          STUDENT="${{ github.actor }}"
          RUN_ID="${{ github.run_id }}"
          ATTEMPT="${{ github.run_attempt }}"

          SESSION_NAME="gha-cdk-${STUDENT}-${RUN_ID}-${ATTEMPT}"

          echo "session-name=${SESSION_NAME}" >> $GITHUB_OUTPUT
          echo "Generated session name: ${SESSION_NAME}"
          echo "Length: ${#SESSION_NAME} characters (max 64)"

          # Validate length
          if [ ${#SESSION_NAME} -gt 64 ]; then
              echo "❌ Session name too long!"
              exit 1
          fi

      - name: Configure AWS credentials via OIDC
        # ENHANCED: Session name includes student identifier and retry attempt
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # Session name now includes:
          # gha-cdk-{student}-{run_id}-{attempt}
          # Example: gha-cdk-alice-1234567890-1
          role-session-name: ${{ steps.session-naming.outputs.session-name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify OIDC credentials
        run: |
          echo "Verifying AWS credentials..."
          IDENTITY=$(aws sts get-caller-identity)
          echo "Assumed role:"
          echo "${IDENTITY}" | jq '.'

          # Extract role session name from assumed identity
          ROLE_SESSION=$(echo "${IDENTITY}" | jq -r '.Arn' | grep -oP '(?<=/)[^/]+$')
          echo "Current session: ${ROLE_SESSION}"

      - name: Run install script
        run: |
          cd bakehouse-app
          ./install.sh
          echo '✅'

      - name: Set CDK environment
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "CDK_DEFAULT_ACCOUNT=$ACCOUNT" >> $GITHUB_ENV
          echo "CDK_DEFAULT_REGION=eu-west-2" >> $GITHUB_ENV

      - name: synth and deploy
        run: |
            cd bakehouse-app
            npx cdk synth 
            npx cdk deploy --verbose

  test:
    runs-on: ubuntu-latest
    name: Unit testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run install script
        run: |
          cd bakehouse-app
          ./install.sh
          echo '✅'

      - name: run unit test
        run: |
          cd bakehouse-app/test/unit-testing
          pwd
          npm test unit-testing

